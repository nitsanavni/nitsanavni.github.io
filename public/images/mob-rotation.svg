<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>Mob rotation: the talker talks, the typist types, the next person is up next, and the rest of the mob follows along; every few minutes everyone moves one seat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6396"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcfb"/>

  <!-- rotation arrows: talker -> typist -> mob -> next -> talker -->
  <g fill="none" stroke="#2f6396" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M215,185 Q320,150 425,185"/>
    <path d="M520,255 Q540,290 515,322"/>
    <path d="M425,370 Q320,405 215,370"/>
    <path d="M120,322 Q100,290 120,255"/>
  </g>

  <!-- people -->
  <g fill="#373d45">
    <!-- talker -->
    <circle cx="170" cy="168" r="18"/>
    <path d="M140,222 Q140,192 170,192 Q200,192 200,222 z"/>
    <!-- typist -->
    <circle cx="470" cy="168" r="18"/>
    <path d="M440,222 Q440,192 470,192 Q500,192 500,222 z"/>
    <!-- rest of the mob -->
    <circle cx="470" cy="338" r="18"/>
    <path d="M440,392 Q440,362 470,362 Q500,362 500,392 z"/>
    <!-- next -->
    <circle cx="170" cy="338" r="18"/>
    <path d="M140,392 Q140,362 170,362 Q200,362 200,392 z"/>
  </g>
  <!-- typist's keyboard -->
  <rect x="446" y="228" width="48" height="10" rx="2" fill="#656870"/>

  <!-- speech bubbles -->
  <g font-size="20" fill="#282f38" text-anchor="middle">
    <path d="M70,60 h170 a12,12 0 0 1 12,12 v40 a12,12 0 0 1 -12,12 h-62 l-14,18 l-4,-18 h-90 a12,12 0 0 1 -12,-12 v-40 a12,12 0 0 1 12,-12 z" fill="#e4ebef"/>
    <text x="155" y="99">I'm talking</text>
    <path d="M400,60 h170 a12,12 0 0 1 12,12 v40 a12,12 0 0 1 -12,12 h-90 l-4,18 l-14,-18 h-62 a12,12 0 0 1 -12,-12 v-40 a12,12 0 0 1 12,-12 z" fill="#e4ebef"/>
    <text x="485" y="99">I'm typing</text>
    <path d="M95,430 h70 l4,-18 l14,18 h62 a12,12 0 0 1 12,12 v34 a12,12 0 0 1 -12,12 h-150 a12,12 0 0 1 -12,-12 v-34 a12,12 0 0 1 12,-12 z" fill="#e4ebef"/>
    <text x="170" y="466">I'm next</text>
  </g>

  <!-- role labels -->
  <g font-size="15" fill="#656870" text-anchor="middle">
    <text x="170" y="245">Talker</text>
    <text x="470" y="258">Typist</text>
    <text x="122" y="385" text-anchor="end">Next</text>
    <text x="470" y="415">Mob</text>
  </g>
</svg>
